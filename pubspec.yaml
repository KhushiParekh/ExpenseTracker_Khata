name: expense_tracker
description: Khaata — a private, offline expense tracker. All data stays on your device.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  share_plus: ^10.0.0

  # State management
  flutter_riverpod: ^2.5.1

  # Local database — the ONLY storage. Works on Android (native sqlite)
  # and Web (IndexedDB-backed WASM sqlite). No backend, no network.
  drift: ^2.16.0
  drift_flutter: ^0.1.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Import / export
  file_picker: ^8.0.6
  csv: ^6.0.0

  # UI
  table_calendar: ^3.1.2
  fl_chart: ^0.68.0
  intl: ^0.19.0
  uuid: ^4.4.0
  google_fonts: ^6.2.1
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.16.0
  build_runner: ^2.4.9
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
